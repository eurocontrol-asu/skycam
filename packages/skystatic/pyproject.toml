[project]
name = "skystatic"
dynamic = ["version"]
description = "Static parts of a fixed all-sky camera: installation and what sits on the optics"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.4",
    "pydantic>=2.7",
    "cyclopts>=4.5",
]

[project.optional-dependencies]
skycam = ["skycam"]

[tool.uv.sources]
skycam = { workspace = true }

[project.urls]
Homepage = "https://github.com/eurocontrol-asu/skyobs/tree/main/packages/skystatic"
Documentation = "https://github.com/eurocontrol-asu/skyobs/blob/main/packages/skystatic/README.md"
Repository = "https://github.com/eurocontrol-asu/skyobs.git"
Issues = "https://github.com/eurocontrol-asu/skyobs/issues"

[project.scripts]
skystatic = "skystatic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
tag-pattern = "^skystatic/v(?P<version>.+)$"

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match skystatic/v[0-9]*"

[tool.hatch.build.targets.wheel]
packages = ["src/skystatic"]

[tool.pytest.ini_options]
testpaths = ["tests_skystatic"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "integration: real I/O (filesystem)",
    "e2e: subprocess / CLI, black box",
]

[tool.coverage.run]
branch = true
source = ["skystatic"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "T20", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["skystatic"]

[tool.ruff.lint.per-file-ignores]
"tests_skystatic/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "skycam.*"]  # skycam is an optional extra
ignore_missing_imports = true
