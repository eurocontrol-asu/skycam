[project]
name = "skyobs-workspace"
version = "0.0.0"
description = "Ground-based sky observation: fisheye geometry, static sky masks and wind reconstruction"
requires-python = ">=3.12"
dependencies = ["skycam", "skystatic", "skywind"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
skycam = { workspace = true }
skystatic = { workspace = true }
skywind = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "skycam-dev" },
    { include-group = "skystatic-dev" },
    { include-group = "skywind-dev" },
]
skycam-dev = [{ include-group = "quality" }, "pytest-asyncio>=0.24", "pytest-benchmark>=4.0"]
skystatic-dev = [{ include-group = "quality" }, "scipy-stubs>=1.14"]
skywind-dev = [{ include-group = "quality" }, "pandas-stubs", "scipy-stubs"]
quality = [
    "pytest>=8.3", "pytest-cov>=5.0", "pytest-mock>=3.14",
    "ruff>=0.8", "mypy>=2.4.1", "pre-commit>=4.0", "pip-audit>=2.0",
]
docs = ["mkdocs-material>=9.0", "mkdocstrings[python]>=0.27"]

[tool.pytest.ini_options]
testpaths = [
    "packages/skycam/tests",
    "packages/skystatic/tests_skystatic",
    "packages/skywind/tests_skywind",
]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "--tb=short"]
asyncio_mode = "auto"
markers = [
    "slow: slow skycam projection tests",
    "integration: real I/O (filesystem)",
    "e2e: subprocess / CLI, black box",
    "requires_store: research stores required; opt in with SKYWIND_TEST_STORES=1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "T20", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
branch = true
source = ["skycam", "skystatic", "skywind"]

[tool.coverage.xml]
output = "coverage.xml"
