[project]
name = "skywind"
version = "0.1.0"
description = "Cruise-altitude wind reconstruction above a ground camera: ERA5 corrected with Mode S (Comm-B) derived winds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "pydantic>=2.6",
    "cyclopts>=4.5",
    "ppigrf>=2.1",
    "pycontrails>=0.54",
    "threadpoolctl>=3.8.0",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
opensky = ["pyopensky>=2.10"]

[project.scripts]
skywind = "skywind.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "scipy-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skywind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not integration and not e2e'"
markers = [
    "integration: real files (data stores)",
    "e2e: command-line, subprocess",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "T20", "RUF", "C90"]
ignore = ["N803", "N806"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["skywind"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/skywind"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["threadpoolctl.*", "ppigrf.*", "pycontrails.*", "pyopensky.*", "sqlalchemy.*", "netCDF4.*", "xarray.*"]
ignore_missing_imports = true
