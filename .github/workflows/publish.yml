name: Publish skycam to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Validate workspace before publishing skycam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - run: make lint
      - run: uv run --locked pytest

  publish:
    name: Build and publish skycam only
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/project/skycam/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv build --package skycam
      - uses: pypa/gh-action-pypi-publish@release/v1
